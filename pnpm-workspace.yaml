packages:
  - packages/*
  - examples

# pnpm 11 では build スクリプトの許可を allowBuilds で管理する
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - "@voidzero-dev/*"
  - "@oxc-project/*"
  - oxlint
  - "@oxlint/*"
  - oxfmt
  - "@oxfmt/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - vitest
  - "@vitest/*"
  - tinybench
  - yuku-core
  - yuku-parser
  - "@yuku-core/*"
  - "@yuku-toolchain/*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.8ec336609b9c3dee6c269c374904b008233dadb8
  vite-plus: 0.0.0-commit.8ec336609b9c3dee6c269c374904b008233dadb8
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
